# docker.conf — dockerspace's settings
#
# Used only when docker_install.sh does not recognise the OS (not Debian, not Ubuntu,
# not based on either) or the OS gives no codename. Missing line → the same default + WARN.
#
# DEFAULT_REPO       Docker's repository: ubuntu | debian
# DEFAULT_CODENAME   the release name in that repository (noble = Ubuntu 24.04 · bookworm = Debian 12)
DEFAULT_REPO=ubuntu
DEFAULT_CODENAME=noble
