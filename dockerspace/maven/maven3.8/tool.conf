# tool.conf — maven/maven3.8: the image mvn.sh runs in
#
# IMAGE   registry/name:version — pinned; change the version here only. Missing → WARN + maven:3.8-eclipse-temurin-21
# CACHE   folder inside the container kept between runs (in dockerspace/.cache/maven/maven3.8/): the downloaded libraries
# ENV     extra VAR=value for the container, space-separated: tells Maven where that folder is
IMAGE=maven:3.8-eclipse-temurin-21
CACHE=/tmp/home/.m2
ENV="MAVEN_CONFIG=/tmp/home/.m2"
